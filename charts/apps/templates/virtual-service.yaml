{{- if .Values.service.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Values.appName }}-vs
  namespace: {{ .Values.namespace | quote }}
spec:
  hosts:
    - "*"
  gateways:
    - {{ include "helper.gatewayName" . }}
  http:
    - match:
      - uri:
          prefix: /{{ .Values.appName }}
      route:
        - destination:
            host: {{ include "helper.serviceName" . }}
            port:
              number: {{ .Values.service.port | default 80 }}
{{- end }}