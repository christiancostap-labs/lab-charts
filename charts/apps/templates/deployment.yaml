apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.appName | quote }}

  template:
    metadata:
      labels:
        app: {{ .Values.appName | quote }}

    spec:
      containers:
        - name: app
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.otel-collector.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.appName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Values.namespace }},deployment.environment=local"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http/dup"