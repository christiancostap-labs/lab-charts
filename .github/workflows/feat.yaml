name: Lint Validation

on:
  push:
    branches:
      - feat/**

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: gha-runner-scale-set
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint ./charts/apps

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          title: "Update Helm report"
          body: "PR created by Github Actions."
