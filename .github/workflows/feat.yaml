name: Lint Validation

on:
  push:
    branches:
      - feat/**

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: arc-runner-set
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint ./charts/apps

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: main
        run: |
          if gh pr list \
            --head "feat/init" \
            --base "main" \
            --state "open" \
            --json number \
            --jq 'length > 0' | grep -q true; then
            echo "Pull request already exists. Skipping creation."
          else
            echo "Creating pull request..."
            gh pr create \
              --head "$HEAD_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "Merge $HEAD_BRANCH into $BASE_BRANCH" \
              --body "PR created automatically by GitHub Actions."
          fi
